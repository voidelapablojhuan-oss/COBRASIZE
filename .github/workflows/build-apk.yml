name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Achar a pasta do projeto
        id: proj
        run: echo "dir=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")" >> "$GITHUB_OUTPUT"
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.proj.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: cobrasize-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
