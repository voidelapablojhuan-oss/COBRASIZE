name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: cobrasize-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Reutilizar assinatura de teste entre versões
        id: debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cobrasize-debug-keystore-v1

      - name: Criar assinatura de teste na primeira compilação
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Achar a pasta do projeto
        id: proj
        run: echo "dir=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.proj.outputs.dir }}

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: cobrasize-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
